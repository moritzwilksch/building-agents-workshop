[workspace]
authors = ["Moritz Wilksch <moritzwilksch@gmail.com>"]
channels = ["conda-forge"]
name = "building-agents-workshop"
platforms = ["osx-arm64", "win-64", "linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
benchmark = "python -m expense_agent.benchmark"
viewer = "python -m expense_agent.viewer.app"
check-setup = "python -m expense_agent.check_setup"
get-api-key = "python scripts/get_api_key.py"
test = "python -m unittest discover -s tests"

[package]
name = "expense-agent"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
python = ">=3.12"
hatchling = "*"

[dependencies]
expense-agent = { path = "." }
python = ">=3.12"
python-dotenv = "*"
loguru = ">=0.7.3,<0.8"
pydantic-ai = ">=2.40.0,<3"
google-genai = ">=2.22.0,<3"
genai-prices = ">=0.1.6,<0.2"
pypdf = ">=6.18.1,<7"
openai = ">=3.12.0,<4"
pydantic-ai-trace = ">=0.2.1,<0.3"
fastapi = ">=0.141.1,<0.142"
uvicorn = ">=0.52.4,<0.53"
bm25s = ">=0.3.11,<0.4"
pillow = ">=12.3.0,<13"
pdf2image = ">=1.17.0,<2"
poppler = ">=26.9.0,<27"

[feature.dev.dependencies]
curl = "*"
git = "*"
git-lfs = "*"

[feature.lint.dependencies]
lefthook = ">=2.0.15,<3"
ruff = "*"

[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.data-generation.dependencies]
typst = "*"

[feature.data-generation.tasks]
compile-figures = "typst compile .data-generation/handbook/figures/figure1-weekend.typ .data-generation/handbook/figures/figure1-weekend.png --ppi 200 && typst compile .data-generation/handbook/figures/figure2-dining.typ .data-generation/handbook/figures/figure2-dining.png --ppi 200 && typst compile .data-generation/handbook/figures/figure3-truffle.typ .data-generation/handbook/figures/figure3-truffle.png --ppi 200"
compile-handbook = { cmd = "typst compile .data-generation/handbook/main.typ data/handbook.pdf", depends-on = ["compile-figures"] }

[environments]
default = ["dev", "lint"]
lint = ["dev", "lint"]
data-generation = ["data-generation"]
