[workspace]
authors = ["Moritz Wilksch <moritzwilksch@gmail.com>"]
channels = ["conda-forge"]
name = "building-agents-workshop"
platforms = ["osx-arm64", "win-64", "linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]

[package]
name = "expense-agent"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
python = ">=3.12"
hatchling = "*"

[dependencies]
expense-agent = { path = "." }
python = ">=3.12"
pydantic-ai = ">=2.40.0,<3"
google-genai = ">=2.22.0,<3"
genai-prices = ">=0.1.6,<0.2"

[feature.data-generation.dependencies]
typst = "*"

[feature.data-generation.tasks]
compile-figures = "typst compile .data-generation/handbook/figures/figure1-weekend.typ .data-generation/handbook/figures/figure1-weekend.png --ppi 200 && typst compile .data-generation/handbook/figures/figure2-dining.typ .data-generation/handbook/figures/figure2-dining.png --ppi 200"
compile-handbook = { cmd = "typst compile .data-generation/handbook/main.typ data/handbook.pdf", depends-on = ["compile-figures"] }

[environments]
data-generation = ["data-generation"]
