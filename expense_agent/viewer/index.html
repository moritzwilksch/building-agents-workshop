<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense agent runs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div class="mx-auto max-w-[1800px] p-6">
      <!-- Runs table -->
      <section id="runs-view">
        <h1 class="mb-4 text-2xl font-semibold">Runs</h1>
        <div class="overflow-hidden rounded-xl bg-white shadow">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-left text-xs font-medium text-slate-500">
              <tr>
                <th class="px-4 py-3">Run</th>
                <th class="px-4 py-3 text-right">Cases</th>
                <th class="px-4 py-3 text-right">% correct</th>
                <th class="px-4 py-3 text-right">% right decision</th>
                <th class="px-4 py-3 text-right">$ overpaid</th>
                <th class="px-4 py-3 text-right">$ underpaid</th>
                <th class="px-4 py-3 text-right">Avg. token cost</th>
              </tr>
            </thead>
            <tbody id="runs-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

      <!-- Run details -->
      <section id="run-view" class="hidden">
        <button id="back" class="mb-4 inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 text-sm shadow hover:bg-slate-50">
          <i data-lucide="arrow-left" class="h-4 w-4"></i>
          All runs
        </button>
        <h1 id="run-title" class="mb-4 text-2xl font-semibold"></h1>
        <div id="run-metrics" class="mb-6 grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-7"></div>

        <div class="grid grid-cols-1 gap-4 xl:grid-cols-12">
          <div class="xl:col-span-2">
            <h2 class="mb-2 flex items-center gap-1.5 text-sm font-semibold text-slate-500">
              <i data-lucide="list" class="h-4 w-4"></i>
              Cases
            </h2>
            <ul id="case-list" class="max-h-[85vh] space-y-1 overflow-y-auto rounded-xl bg-white p-2 shadow"></ul>
          </div>
          <div class="space-y-4 xl:col-span-10">
            <div id="case-receipt" class="rounded-xl bg-white p-4 shadow"></div>
            <div id="case-reasoning" class="rounded-xl bg-white p-4 shadow"></div>
            <div id="case-diff" class="rounded-xl bg-white p-4 shadow"></div>
          </div>
        </div>
      </section>

      <!-- Trajectory page -->
      <section id="trace-view" class="hidden">
        <button id="trace-back" class="mb-4 inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 text-sm shadow hover:bg-slate-50">
          <i data-lucide="arrow-left" class="h-4 w-4"></i>
          <span id="trace-back-label"></span>
        </button>
        <iframe id="trace" class="h-[80vh] w-full rounded-xl bg-white shadow" src="about:blank"></iframe>
      </section>
    </div>

    <script>
      const runsView = document.getElementById("runs-view");
      const runView = document.getElementById("run-view");
      const traceView = document.getElementById("trace-view");
      let currentRun = null;

      const pct = (value) => (value === null || value === undefined ? "–" : (100 * value).toFixed(0) + "%");
      const money = (value) => (value < 0 ? "-$" : "$") + Math.abs(value ?? 0).toFixed(2);
      const cost = (value) => "$" + (value ?? 0).toFixed(4);

      async function getJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(await response.text());
        return response.json();
      }

      // Renders any <i data-lucide> placeholders inserted since the last call.
      // Icons are decorative: skip silently if the CDN script failed to load.
      function refreshIcons() {
        if (!window.lucide) return;
        lucide.createIcons();
      }

      function tile(label, value, icon) {
        return `<div class="rounded-xl bg-white p-4 shadow">
          <div class="flex items-center gap-1.5 text-xs font-medium text-slate-500">
            <i data-lucide="${icon}" class="h-3.5 w-3.5"></i>
            ${label}
          </div>
          <div class="mt-1 text-xl font-semibold">${value}</div>
        </div>`;
      }

      async function showRuns() {
        traceView.classList.add("hidden");
        runView.classList.add("hidden");
        runsView.classList.remove("hidden");
        const runs = await getJson("/api/runs");
        document.getElementById("runs-body").innerHTML = runs
          .map(
            (run) => `<tr class="cursor-pointer hover:bg-sky-50" onclick="showRun('${encodeURIComponent(run.run_id)}')">
              <td class="px-4 py-3 font-medium">${run.run_id}</td>
              <td class="px-4 py-3 text-right">${run.total_cases}${run.failed_cases ? ` <span class="text-red-600">(${run.failed_cases} failed)</span>` : ""}</td>
              <td class="px-4 py-3 text-right">${pct(run.pass_rate)}</td>
              <td class="px-4 py-3 text-right">${pct(run.decision_accuracy)}</td>
              <td class="px-4 py-3 text-right">${money(run.overpaid)}</td>
              <td class="px-4 py-3 text-right">${money(run.underpaid)}</td>
              <td class="px-4 py-3 text-right">${cost(run.mean_cost)}</td>
            </tr>`,
          )
          .join("");
        refreshIcons();
      }

      async function showRun(runId) {
        traceView.classList.add("hidden");
        runsView.classList.add("hidden");
        runView.classList.remove("hidden");
        currentRun = await getJson(`/api/runs/${runId}`);
        document.getElementById("run-title").textContent = currentRun.run_id;
        document.getElementById("run-metrics").innerHTML = [
          tile("% correct", pct(currentRun.pass_rate), "percent"),
          tile("% right decision", pct(currentRun.decision_accuracy), "scale"),
          tile("$ overpaid", money(currentRun.overpaid), "dollar-sign"),
          tile("$ underpaid", money(currentRun.underpaid), "dollar-sign"),
          tile("Avg. $ error", money(currentRun.mean_reimbursed_error), "banknote"),
          tile("Avg. token cost", cost(currentRun.mean_cost), "coins"),
          tile("Cases", `${currentRun.total_cases}${currentRun.failed_cases ? ` / ${currentRun.failed_cases} failed` : ""}`, "layers"),
        ].join("");
        renderCaseList();
        if (currentRun.cases.length) showCase(currentRun.cases[0].case_id);
        refreshIcons();
      }

      function renderCaseList(selected) {
        document.getElementById("case-list").innerHTML = currentRun.cases
          .map((row) => {
            const [mark, color] = row.failed
              ? ["x", "text-red-600"]
              : row.correct
                ? ["check", "text-emerald-600"]
                : ["triangle-alert", "text-amber-600"];
            const active = row.case_id === selected ? "bg-sky-100" : "hover:bg-slate-50";
            return `<li class="flex cursor-pointer items-center gap-1.5 rounded-lg px-3 py-2 text-sm ${active}" onclick="showCase('${row.case_id}')">
              <i data-lucide="${mark}" class="h-4 w-4 shrink-0 ${color}"></i>
              ${row.case_id}
            </li>`;
          })
          .join("");
        refreshIcons();
      }

      function heading(icon, text) {
        return `<h3 class="flex items-center gap-1.5 text-xs font-semibold text-slate-500">
          <i data-lucide="${icon}" class="h-3.5 w-3.5"></i>
          ${text}
        </h3>`;
      }

      // Diff-style value: one plain value when equal, otherwise a red
      // removal (expected) and a green addition (actual), git-style.
      function diffValue(expected, actual) {
        if (expected === null) return `<span class="font-medium text-emerald-600">+${money(actual)}</span>`;
        if (actual === null) return `<span class="font-medium text-red-600">−${money(expected)}</span>`;
        if (Number(expected) === Number(actual)) return money(actual);
        return `<span class="text-red-600 line-through">−${money(expected)}</span> <span class="font-medium text-emerald-600">+${money(actual)}</span>`;
      }

      // Merge expected and actual line items into one diff-style table.
      // Expected order first, then items the agent invented.
      function mergeItems(expectedItems, actualItems) {
        const rows = expectedItems.map((item) => {
          const match = actualItems.find((a) => a.description === item.description);
          return { description: item.description, claimed: Number(item.claimed), expected: Number(item.reimbursed), actual: match ? Number(match.reimbursed) : null };
        });
        for (const item of actualItems) {
          if (!expectedItems.some((e) => e.description === item.description)) {
            rows.push({ description: item.description, claimed: Number(item.claimed), expected: null, actual: Number(item.reimbursed) });
          }
        }
        return rows;
      }

      async function showCase(caseId) {
        renderCaseList(caseId);
        const detail = await getJson(`/api/runs/${encodeURIComponent(currentRun.run_id)}/cases/${caseId}`);
        const expected = detail.expected;
        const actual = detail.actual;

        const receipt = `<a href="/api/cases/${caseId}/receipt" target="_blank">
            <img src="/api/cases/${caseId}/receipt" alt="receipt for ${caseId}" class="mx-auto max-h-[35vh] rounded-lg" />
          </a>`;

        let reasoning;
        let diff;
        if (!actual) {
          reasoning = `<p class="rounded-lg bg-red-50 p-3 text-sm text-red-700">${detail.error ?? "case failed"}</p>`;
          diff = "";
        } else {
          reasoning = `<div class="flex items-start justify-between gap-4">
              <p class="whitespace-pre-wrap text-sm text-slate-700">${actual.reasoning}</p>
              <button onclick="showTrace('${caseId}')" class="inline-flex shrink-0 items-center gap-2 rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white shadow hover:bg-sky-700">
                <i data-lucide="route" class="h-4 w-4"></i>
                Inspect trajectory
              </button>
            </div>`;

          const items = mergeItems(expected.line_items, actual.line_items);
          const itemRows = items
            .map((item) => {
              const changed = item.expected === null || item.actual === null || item.expected !== item.actual;
              return `<tr class="${changed ? "bg-amber-50" : ""}">
                <td class="py-1 pr-4">${item.description}</td>
                <td class="py-1 pr-4 text-right text-slate-600">${money(item.claimed)}</td>
                <td class="py-1 text-right">${diffValue(item.expected, item.actual)}</td>
              </tr>`;
            })
            .join("");
          const anyChanged = items.some((item) => item.expected === null || item.actual === null || item.expected !== item.actual);

          diff = `${heading("receipt", "Invoice diff")}
            <table class="mt-2 w-full text-sm">
              <thead><tr class="text-left text-xs font-medium text-slate-500">
                <th class="pb-2">Item</th><th class="pb-2 text-right">Claimed</th><th class="pb-2 text-right">Reimbursed</th>
              </tr></thead>
              <tbody class="divide-y divide-slate-100">
                ${itemRows}
                <tr class="font-medium">
                  <td class="py-1 pr-4">Reimbursed total</td>
                  <td class="py-1 pr-4 text-right text-slate-600">${money(Number(expected.claimed_amount))}</td>
                  <td class="py-1 text-right">${diffValue(Number(expected.reimbursed_amount), Number(actual.reimbursed_amount))}</td>
                </tr>
              </tbody>
            </table>
            <div class="mt-2 text-xs text-slate-500">
              ${anyChanged ? "Red: expected payout removed. Green: actual payout. Highlighted rows differ." : "All line items match the ground truth."}
            </div>
            <div class="mt-3 flex flex-wrap gap-x-6 gap-y-1 text-sm">
              <span class="text-slate-500">decision <span class="font-medium text-slate-900">${expected.decision === actual.decision ? actual.decision : `${expected.decision} → ${actual.decision}`}</span></span>
              <span class="text-slate-500">$ error <span class="font-medium text-slate-900">${money(detail.reimbursed_error)}</span></span>
              <span class="text-slate-500">$ overpaid <span class="font-medium text-slate-900">${money(detail.overpaid)}</span></span>
              <span class="text-slate-500">$ underpaid <span class="font-medium text-slate-900">${money(detail.underpaid)}</span></span>
              <span class="text-slate-500">token cost <span class="font-medium text-slate-900">${cost(detail.cost)}</span></span>
              <span class="text-slate-500">tokens <span class="font-medium text-slate-900">${detail.tokens.toLocaleString()}</span></span>
            </div>`;
        }

        document.getElementById("case-receipt").innerHTML = receipt;
        document.getElementById("case-reasoning").innerHTML = `${heading("brain", "Agent reasoning")}${reasoning}`;
        document.getElementById("case-diff").innerHTML = diff;
        refreshIcons();
      }

      async function showTrace(caseId) {
        document.getElementById("trace-back-label").textContent = `Back to ${caseId}`;
        document.getElementById("trace").src = `/api/runs/${encodeURIComponent(currentRun.run_id)}/cases/${caseId}/trace`;
        runView.classList.add("hidden");
        traceView.classList.remove("hidden");
        refreshIcons();
      }

      document.getElementById("back").onclick = showRuns;
      document.getElementById("trace-back").onclick = () => {
        document.getElementById("trace").src = "about:blank";
        traceView.classList.add("hidden");
        runView.classList.remove("hidden");
      };
      refreshIcons();
      showRuns();
    </script>
  </body>
</html>
