<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense agent runs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div class="mx-auto max-w-[1800px] p-6">
      <!-- Runs table -->
      <section id="runs-view">
        <h1 class="mb-4 text-2xl font-semibold">Runs</h1>
        <div class="overflow-hidden rounded-xl bg-white shadow">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-left text-xs font-medium text-slate-500">
              <tr>
                <th class="px-4 py-3">Run</th>
                <th class="px-4 py-3 text-right">Cases</th>
                <th class="px-4 py-3 text-right">% correct</th>
                <th class="px-4 py-3 text-right">% right decision</th>
                <th class="px-4 py-3 text-right">Avg. € overpaid</th>
                <th class="px-4 py-3 text-right">Avg. € underpaid</th>
                <th class="px-4 py-3 text-right">Avg. € error</th>
                <th class="px-4 py-3 text-right">Avg. token cost ($)</th>
              </tr>
            </thead>
            <tbody id="runs-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

      <!-- Run details -->
      <section id="run-view" class="hidden">
        <button id="back" class="mb-4 inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 text-sm shadow hover:bg-slate-50">
          <i data-lucide="arrow-left" class="h-4 w-4"></i>
          All runs
        </button>
        <h1 id="run-title" class="mb-4 text-2xl font-semibold"></h1>
        <div id="run-metrics" class="mb-6 grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-7"></div>
        <hr class="mb-6 border-slate-300" />

        <div class="grid grid-cols-1 gap-4 xl:grid-cols-12">
          <div class="xl:col-span-2">
            <h2 class="mb-2 flex items-center gap-1.5 text-sm font-semibold text-slate-500">
              <i data-lucide="list" class="h-4 w-4"></i>
              Cases
            </h2>
            <ul id="case-list" class="max-h-[85vh] space-y-1 overflow-y-auto rounded-xl bg-white p-2 shadow"></ul>
          </div>
          <div class="space-y-4 xl:col-span-4">
            <div id="case-note" class="rounded-xl bg-white p-4 shadow"></div>
            <div id="case-receipt" class="rounded-xl bg-white p-4 shadow"></div>
          </div>
          <div class="space-y-4 xl:col-span-6">
            <div id="case-reasoning" class="rounded-xl bg-white p-4 shadow"></div>
            <div id="case-truth" class="rounded-xl bg-white p-4 shadow"></div>
            <div id="case-diff" class="rounded-xl bg-white p-4 shadow"></div>
          </div>
        </div>
      </section>

      <!-- Trajectory page -->
      <section id="trace-view" class="hidden">
        <button id="trace-back" class="mb-4 inline-flex items-center gap-1.5 rounded-lg bg-white px-3 py-1.5 text-sm shadow hover:bg-slate-50">
          <i data-lucide="arrow-left" class="h-4 w-4"></i>
          <span id="trace-back-label"></span>
        </button>
        <iframe id="trace" class="h-[80vh] w-full rounded-xl bg-white shadow" src="about:blank"></iframe>
      </section>
    </div>

    <script>
      const runsView = document.getElementById("runs-view");
      const runView = document.getElementById("run-view");
      const traceView = document.getElementById("trace-view");
      let currentRun = null;
      // Receipts are regenerated in place at a constant URL, so a browser can
      // reuse a stale cached copy. A per-page-load version forces a refetch.
      const receiptVersion = Date.now();
      const receiptUrl = (caseId) => `/api/cases/${encodeURIComponent(caseId)}/receipt?v=${receiptVersion}`;

      const pct = (value) => (value === null || value === undefined ? "–" : (100 * value).toFixed(0) + "%");
      // Claim amounts are euros. Token cost is US dollars: that is how the
      // model providers price it.
      const money = (value) => (value < 0 ? "-€" : "€") + Math.abs(value ?? 0).toFixed(2);
      const cost = (value) => "$" + (value ?? 0).toFixed(4);

      // Render model output and user-provided names as text, never markup.
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[char]);
      const jsArg = (value) => escapeHtml(JSON.stringify(String(value)));

      async function getJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(await response.text());
        return response.json();
      }

      // Renders any <i data-lucide> placeholders inserted since the last call.
      // Icons are decorative: skip silently if the CDN script failed to load.
      function refreshIcons() {
        if (!window.lucide) return;
        lucide.createIcons();
      }

      function tile(label, value, icon) {
        return `<div class="rounded-xl bg-white p-4 shadow">
          <div class="flex items-center gap-1.5 text-xs font-medium text-slate-500">
            <i data-lucide="${icon}" class="h-3.5 w-3.5"></i>
            ${label}
          </div>
          <div class="mt-1 text-xl font-semibold">${value}</div>
        </div>`;
      }

      async function showRuns() {
        traceView.classList.add("hidden");
        runView.classList.add("hidden");
        runsView.classList.remove("hidden");
        const runs = await getJson("/api/runs");
        document.getElementById("runs-body").innerHTML = runs
          .map(
            (run) => `<tr class="cursor-pointer hover:bg-indigo-50" onclick="showRun(${jsArg(encodeURIComponent(run.run_id))})">
              <td class="px-4 py-3 font-medium">${escapeHtml(run.run_id)}</td>
              <td class="px-4 py-3 text-right">${run.total_cases}${run.failed_cases ? ` <span class="text-red-600">(${run.failed_cases} failed)</span>` : ""}</td>
              <td class="px-4 py-3 text-right">${pct(run.pass_rate)}</td>
              <td class="px-4 py-3 text-right">${pct(run.decision_accuracy)}</td>
              <td class="px-4 py-3 text-right">${money(run.mean_overpaid)}</td>
              <td class="px-4 py-3 text-right">${money(run.mean_underpaid)}</td>
              <td class="px-4 py-3 text-right">${money(run.mean_reimbursed_error)}</td>
              <td class="px-4 py-3 text-right">${cost(run.mean_cost)}</td>
            </tr>`,
          )
          .join("") || '<tr><td colspan="8" class="px-4 py-6 text-slate-500">No runs yet. Run a benchmark, then refresh this page.</td></tr>';
        refreshIcons();
      }

      async function showRun(runId) {
        traceView.classList.add("hidden");
        runsView.classList.add("hidden");
        runView.classList.remove("hidden");
        currentRun = await getJson(`/api/runs/${runId}`);
        document.getElementById("run-title").textContent = currentRun.run_id;
        document.getElementById("run-metrics").innerHTML = [
          tile("% correct", pct(currentRun.pass_rate), "percent"),
          tile("% right decision", pct(currentRun.decision_accuracy), "scale"),
          tile("Avg. € overpaid", money(currentRun.mean_overpaid), "dollar-sign"),
          tile("Avg. € underpaid", money(currentRun.mean_underpaid), "dollar-sign"),
          tile("Avg. € error", money(currentRun.mean_reimbursed_error), "banknote"),
          tile("Avg. token cost ($)", cost(currentRun.mean_cost), "coins"),
          tile("Cases", `${currentRun.total_cases}${currentRun.failed_cases ? ` / ${currentRun.failed_cases} failed` : ""}`, "layers"),
        ].join("");
        renderCaseList();
        if (currentRun.cases.length) showCase(currentRun.cases[0].case_id);
        refreshIcons();
      }

      function renderCaseList(selected) {
        document.getElementById("case-list").innerHTML = currentRun.cases
          .map((row) => {
            const [mark, color] = row.failed
              ? ["circle-x", "text-red-600"]
              : row.correct
                ? ["check", "text-emerald-600"]
                : ["x", "text-red-600"];
            const active = row.case_id === selected ? "bg-indigo-100" : "hover:bg-slate-50";
            return `<li class="flex cursor-pointer items-center gap-1.5 rounded-lg px-3 py-2 text-sm ${active}" onclick="showCase(${jsArg(row.case_id)})">
              <i data-lucide="${mark}" class="h-4 w-4 shrink-0 ${color}"></i>
              ${escapeHtml(row.case_id)}
            </li>`;
          })
          .join("");
        refreshIcons();
      }

      function heading(icon, text) {
        return `<h3 class="flex items-center gap-1.5 text-xs font-semibold text-slate-500">
          <i data-lucide="${icon}" class="h-3.5 w-3.5"></i>
          ${text}
        </h3>`;
      }

      // Anything the agent itself produced carries the violet accent: a
      // violet heading with an "AI" tag, and a body panel with a violet left
      // rule on a light violet ground. The text stays slate so long passages
      // remain readable; the frame does the signalling.
      function aiHeading(icon, text) {
        return `<h3 class="flex items-center gap-1.5 text-xs font-semibold text-violet-600">
          <i data-lucide="${icon}" class="h-3.5 w-3.5"></i>
          ${text}
          <span class="rounded bg-violet-50 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-violet-500">AI</span>
        </h3>`;
      }

      function aiBody(html) {
        return `<div class="mt-2 rounded-r-lg border-l-2 border-violet-500 bg-violet-50 p-3 text-sm text-slate-700">${html}</div>`;
      }

      // One label/value line in the per-case stats list.
      function statRow(label, value) {
        return `<div class="flex items-baseline justify-between py-1.5">
          <dt class="text-slate-500">${label}</dt>
          <dd class="font-medium text-slate-900">${value}</dd>
        </div>`;
      }

      // Row tint: green where the agent paid above the ground truth, red
      // where it paid below, nothing where the payouts match.
      function rowTint(expected, actual) {
        const delta = Number(actual ?? 0) - Number(expected ?? 0);
        if (delta === 0) return "";
        return delta > 0 ? "bg-emerald-50" : "bg-red-50";
      }

      // Diff cell: a dash when the payout matches, otherwise a signed delta.
      // Red means the payout fell below expected, green above. Missing sides
      // count as zero so unmatched items read as a full add or remove.
      function diffDelta(expected, actual) {
        const delta = Number(actual ?? 0) - Number(expected ?? 0);
        if (delta === 0) return `<span class="text-slate-400">–</span>`;
        const sign = delta > 0 ? "+" : "−";
        const color = delta > 0 ? "text-emerald-600" : "text-red-600";
        return `<span class="font-medium ${color}">${sign}${money(Math.abs(delta))}</span>`;
      }

      // Merge expected and actual line items into one diff-style table by
      // line id: the agent numbers receipt lines 0..n the same way we do, so
      // descriptions never have to match and we always show ours. Expected
      // order first, then any ids the agent invented.
      function mergeItems(expectedItems, actualItems) {
        const byId = new Map(actualItems.map((item) => [item.id, item]));
        const rows = expectedItems.map((item) => {
          const match = byId.get(item.id);
          return {
            id: item.id,
            description: item.description,
            claimed: Number(item.claimed),
            expected: Number(item.reimbursed),
            actual: match ? Number(match.reimbursed) : null,
          };
        });
        const expectedIds = new Set(expectedItems.map((item) => item.id));
        actualItems.forEach((item) => {
          if (!expectedIds.has(item.id)) {
            rows.push({
              id: item.id,
              description: item.description,
              claimed: Number(item.claimed),
              expected: null,
              actual: Number(item.reimbursed),
            });
          }
        });
        return rows;
      }

      async function showCase(caseId) {
        renderCaseList(caseId);
        const detail = await getJson(`/api/runs/${encodeURIComponent(currentRun.run_id)}/cases/${encodeURIComponent(caseId)}`);
        const expected = detail.expected;
        const actual = detail.actual;

        const note = `${heading("sticky-note", "Employee note")}
          <p class="mt-2 whitespace-pre-wrap text-sm ${detail.note ? "text-slate-700" : "text-slate-400"}">${escapeHtml(detail.note ?? "No note submitted with this claim.")}</p>`;

        const receipt = `<a href="${receiptUrl(caseId)}" target="_blank">
            <img src="${receiptUrl(caseId)}" alt="receipt for ${escapeHtml(caseId)}" class="mx-auto max-h-[80vh] w-full rounded-lg object-contain" />
          </a>`;

        let reasoning;
        let diff;
        if (!actual) {
          reasoning = `<p class="rounded-r-lg border-l-2 border-red-600 bg-red-50 p-3 text-sm text-red-600">${escapeHtml(detail.error ?? "case failed")}</p>`;
          diff = "";
        } else {
          reasoning = aiBody(`<p class="whitespace-pre-wrap">${escapeHtml(actual.reasoning)}</p>`);

          const items = mergeItems(expected.line_items, actual.line_items);
          const itemRows = items
            .map(
              (item) => `<tr class="${rowTint(item.expected, item.actual)}">
                <td class="py-1 pr-4"><span class="mr-1.5 text-xs text-slate-400">${item.id}</span>${escapeHtml(item.description)}</td>
                <td class="py-1 pr-4 text-right text-slate-600">${money(item.claimed)}</td>
                <td class="py-1 pr-4 text-right text-slate-600">${item.expected === null ? "–" : money(item.expected)}</td>
                <td class="py-1 pr-4 text-right text-violet-600">${item.actual === null ? "–" : money(item.actual)}</td>
                <td class="py-1 text-right">${diffDelta(item.expected, item.actual)}</td>
              </tr>`,
            )
            .join("");
          diff = `${heading("receipt", "Invoice diff")}
            <table class="mt-2 w-full text-sm">
              <thead><tr class="border-b border-slate-300 text-left text-xs font-medium text-slate-500">
                <th class="pb-2 pr-4">Item</th>
                <th class="pb-2 pr-4 text-right">Claimed</th>
                <th class="pb-2 pr-4 text-right">Ground truth</th>
                <th class="pb-2 pr-4 text-right text-violet-600">Reimbursed <span class="text-[10px] uppercase tracking-wide text-violet-500">AI</span></th>
                <th class="pb-2 text-right">Diff</th>
              </tr></thead>
              <tbody class="divide-y divide-slate-100">
                ${itemRows}
              </tbody>
              <tfoot>
                <tr class="border-t border-slate-300 font-medium">
                  <td class="py-1 pr-4">Reimbursed total</td>
                  <td class="py-1 pr-4 text-right text-slate-600">${money(Number(expected.claimed_amount))}</td>
                  <td class="py-1 pr-4 text-right text-slate-600">${money(Number(expected.reimbursed_amount))}</td>
                  <td class="py-1 pr-4 text-right text-violet-600">${money(Number(actual.reimbursed_amount))}</td>
                  <td class="py-1 text-right">${diffDelta(Number(expected.reimbursed_amount), Number(actual.reimbursed_amount))}</td>
                </tr>
              </tfoot>
            </table>
            <dl class="mt-4 divide-y divide-slate-100 rounded-lg bg-slate-50 px-3 text-sm">
              ${statRow("decision", expected.decision === actual.decision
                ? `<span class="text-emerald-600">${actual.decision}</span>`
                : `<span class="text-slate-500">${expected.decision}</span> → <span class="text-red-600">${actual.decision}</span>`)}
              ${statRow("€ error", money(detail.reimbursed_error))}
              ${statRow("€ overpaid", money(detail.overpaid))}
              ${statRow("€ underpaid", money(detail.underpaid))}
              ${statRow("token cost ($)", cost(detail.cost))}
              ${statRow("tokens", detail.tokens.toLocaleString())}
            </dl>`;
        }

        document.getElementById("case-note").innerHTML = note;
        document.getElementById("case-receipt").innerHTML = receipt;
        document.getElementById("case-reasoning").innerHTML = `<div class="flex items-center justify-between gap-4">
            ${aiHeading("brain", "Agent reasoning")}
            <button onclick="showTrace(${jsArg(caseId)})" class="inline-flex shrink-0 items-center gap-1.5 rounded-lg bg-violet-600 px-3 py-1.5 text-sm font-medium text-white shadow hover:bg-violet-700">
              <i data-lucide="route" class="h-4 w-4"></i>
              Inspect trajectory
            </button>
          </div>${reasoning}`;
        document.getElementById("case-truth").innerHTML = `${heading("book-check", "Ground truth reasoning")}
          <p class="mt-2 whitespace-pre-wrap text-sm text-slate-700">${escapeHtml(expected.reasoning)}</p>`;
        document.getElementById("case-diff").innerHTML = diff;
        refreshIcons();
      }

      async function showTrace(caseId) {
        document.getElementById("trace-back-label").textContent = `Back to ${caseId}`;
        document.getElementById("trace").src = `/api/runs/${encodeURIComponent(currentRun.run_id)}/cases/${encodeURIComponent(caseId)}/trace`;
        runView.classList.add("hidden");
        traceView.classList.remove("hidden");
        refreshIcons();
      }

      document.getElementById("back").onclick = showRuns;
      document.getElementById("trace-back").onclick = () => {
        document.getElementById("trace").src = "about:blank";
        traceView.classList.add("hidden");
        runView.classList.remove("hidden");
      };
      refreshIcons();
      showRuns();
    </script>
  </body>
</html>
